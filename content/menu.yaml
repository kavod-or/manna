# Optional prices use conference.currency.
# Omit price (or use null) to hide it; price: 0 displays zero.
# Add sold_out: true to any meal or item to show the localized sold-out label.
conference:
  currency: dollar
  # Add language codes here and provide each translation throughout this file.
  languages: [de, en, ru]
  serious_mode: false
  easter_egg_mode: mazel_tov
  # Set this to an image in the content directory, for example: example-conference-logo.png
  logo: ""
  # Optional payment notice (requires every configured language):
  # payment: {de: Nur Barzahlung, en: Cash only, ru: Только наличные}
  # All serving times below use this timezone.
  timezone: Europe/Berlin
  name:
    de: Beispiel Konferenz
    en: Example Conference
    ru: Пример конференции
  location:
    de: Raum 1 · Ebene 1
    en: Room 1 · Level 1
    ru: Зал 1 · уровень 1

tags:
  vegetarian:
    de: Vegetarisch
    en: Vegetarian
    ru: Вегетарианское
  gluten_free:
    de: Glutenfrei
    en: Gluten-free
    ru: Без глютена
  kosher:
    de: Koscher
    en: Kosher
    ru: Кошерное

permanent:
