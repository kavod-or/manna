      price: 2.50
      name:
        de: Filter-Kaffee
        en: Filter coffee
        ru: Фильтр-кофе
    - id: espresso
      price_normal: 2.00
      price_large: 3.00
      name:
        de: Espresso
        en: Espresso
        ru: Эспрессо
    - id: latte_macchiato
      price: 3.80
      name:
        de: Latte Macchiato
        en: Latte macchiato
        ru: Латте макиато
    - id: flat_white
      price: 3.50
      name:
        de: Flat White
        en: Flat white
        ru: Флэт уайт
    - id: americano
      price_normal: 2.80
      price_large: 3.50
      name:
        de: Americano
        en: Americano
        ru: Американо
    - id: cortado
      price: 2.80
      name:
        de: Cortado
        en: Cortado
        ru: Кортадо
    - id: cappuccino
      sold_out: true
