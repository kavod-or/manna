      price: 2.00
      name:
        de: Wasser (still, medium, classic), Coca Cola, Fanta, Cola Mix, Apfelschorle, Rote-Früchte Schorle, Iso Sport
        en: Water (still, medium-carbonated, sparkling), Coca-Cola, Fanta, cola mix, apple spritzer, red berry spritzer, isotonic sports drink
        ru: Вода (негазированная, слабогазированная, газированная), Coca-Cola, Fanta, кола-микс, яблочный шорле, шорле из красных ягод, изотонический напиток
  snacks:
    - id: fruit
      price: 0
      name:
        de: Frisches Obst
        en: Fresh fruit
        ru: Свежие фрукты
      tags: [vegetarian, gluten_free]
    - id: granola_bars
      sold_out: true
      price: 1.50
      name:
        de: Müsliriegel
        en: Granola bars
        ru: Батончики мюсли
      tags: [vegetarian]
    - id: savoury_snacks
      price: 1.00
      name:
        de: Salzgebäck
        en: Savoury snacks
        ru: Солёные закуски

