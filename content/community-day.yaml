# Optional prices use conference.currency.
# Omit price (or use null) to hide it; price: 0 displays zero.
# Add sold_out: true to any meal or item to show the localized sold-out label.
conference:
  currency: dollar
  # Add language codes here and provide each translation throughout this file.
  languages: [de, en]
  serious_mode: true
  # Set this to an image in the content directory, for example: community-day-logo.png
  logo: ""
  # Optional payment notice (requires every configured language):
  # payment: {de: Kartenzahlung möglich, en: Card payment accepted}
  # All serving times below use this timezone.
  timezone: Europe/Berlin
  name:
    de: Gemeinschaftstag
    en: Community Day
  location:
    de: Garten · Terrasse
    en: Garden · Terrace

tags:
  vegetarian:
    de: Vegetarisch
    en: Vegetarian
  gluten_free:
    de: Glutenfrei
    en: Gluten-free
  kosher:
    de: Koscher
    en: Kosher

permanent:
  coffee:
    - id: filter_coffee
      price: 2.50
      name:
        de: Filter-Kaffee
        en: Filter coffee
    - id: espresso
      price_normal: 2.00
      price_large: 3.00
      name:
        de: Espresso
        en: Espresso
    - id: latte_macchiato
      price: 3.80
      name:
        de: Latte Macchiato
        en: Latte macchiato
    - id: flat_white
      price: 3.50
      name:
        de: Flat White
        en: Flat white
    - id: americano
      price_normal: 2.80
      price_large: 3.50
      name:
        de: Americano
        en: Americano
    - id: cortado
      price: 2.80
      name:
        de: Cortado
        en: Cortado
    - id: cappuccino
      sold_out: true
      price_normal: 3.20
      price_large: 4.20
      name:
        de: Cappuccino
        en: Cappuccino
  drinks:
    - id: softdrinks
      price: 2.00
      name:
        de: Wasser (still, medium, classic), Coca Cola, Fanta, Cola Mix, Apfelschorle, Rote-Früchte Schorle, Iso Sport
        en: Water (still, medium-carbonated, sparkling), Coca-Cola, Fanta, cola mix, apple spritzer, red berry spritzer, isotonic sports drink
  snacks:
    - id: fruit
      price: 0
      name:
        de: Frisches Obst
        en: Fresh fruit
      tags: [vegetarian, gluten_free]
    - id: granola_bars
      sold_out: true
      price: 1.50
      name:
        de: Müsliriegel
        en: Granola bars
      tags: [vegetarian]
    - id: savoury_snacks
      price: 1.00
      name:
        de: Salzgebäck
        en: Savoury snacks

# Example dates start on 8 September 2026; update them for your event.
