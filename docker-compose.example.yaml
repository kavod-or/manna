services:
  manna:
    build:
      context: .
    image: manna:local
    ports:
      # The host reverse proxy may reach Manna; untrusted networks may not.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      CONTENT_DIR: /app/content
      MANNA_ADMIN_PASSWORD: "${MANNA_ADMIN_PASSWORD:?set MANNA_ADMIN_PASSWORD in .env (at least 16 characters)}"
      MANNA_ADMIN_TRUST_PROXY_HTTPS: "${MANNA_ADMIN_TRUST_PROXY_HTTPS:-false}"
      MANNA_ADMIN_TRUSTED_PROXY_CIDRS: "${MANNA_ADMIN_TRUSTED_PROXY_CIDRS:-}"
    volumes:
      # Only event content is writable; the rest of the container stays read-only.
      - ./content:/app/content:rw,Z
      # The editor may update menu files, never the event manifest.
      - ./content/events.yaml:/app/content/events.yaml:ro,Z
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
