services:
  mana:
    build:
      context: .
    image: mana:local
    ports:
      # The host reverse proxy may reach Mana; untrusted networks may not.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      CONTENT_DIR: /app/content
      MANA_ADMIN_PASSWORD: "${MANA_ADMIN_PASSWORD:?set MANA_ADMIN_PASSWORD in .env (at least 16 characters)}"
      MANA_ADMIN_TRUST_PROXY_HTTPS: "${MANA_ADMIN_TRUST_PROXY_HTTPS:-false}"
      MANA_ADMIN_TRUSTED_PROXY_CIDRS: "${MANA_ADMIN_TRUSTED_PROXY_CIDRS:-}"
    volumes:
      # Only event content is writable; the rest of the container stays read-only.
      - ./content:/app/content:rw
      # The editor may update menu files, never the event manifest.
      - ./content/events.yaml:/app/content/events.yaml:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
